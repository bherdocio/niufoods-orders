default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "niufoods") %>
  password: <%= ENV.fetch("DB_PASSWORD", "niufoods") %>

development:
  <<: *default
  database: niufoods_orders_development

test:
  <<: *default
  database: niufoods_orders_test

production:
  <<: *default
  database: niufoods_orders_production
